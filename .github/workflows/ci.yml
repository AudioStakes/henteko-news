name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run check:words
      - name: Install Playwright Chromium
        id: playwright_install
        run: npx playwright install --with-deps chromium
        continue-on-error: true
      - name: Run layout tests
        if: steps.playwright_install.outcome == 'success'
        run: npm run test:layout
      - name: Layout test skipped notice
        if: steps.playwright_install.outcome != 'success'
        run: |
          echo "Playwright browser installation failed (likely network/CDN)."
          echo "Layout tests were skipped in this run."
