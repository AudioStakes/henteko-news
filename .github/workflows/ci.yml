name: CI
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
        id: lint
      - name: Show suggested formatting changes after a lint failure
        if: failure() && steps.lint.outcome == 'failure'
        run: |
          npm run format || true
          git diff --no-ext-diff
      - run: npm run test
      - run: npm run test:scripts
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - run: npm run check:words
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-failure-traces
          path: test-results/
          retention-days: 7
  speech:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: npm
      - run: npm ci
      - run: npm run setup:speech
      - run: npm run check:speech-assets
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium tests/speech.spec.ts
        env:
          RUN_SPEECH_SMOKE: "1"
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan all fetched Git history for secrets
        run: |
          audit_tools="${RUNNER_TEMP}/henteko-audit"
          mkdir -p "$audit_tools"
          curl --fail --location --retry 3 --output "$audit_tools/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$audit_tools/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$audit_tools/gitleaks.tar.gz" -C "$audit_tools" gitleaks
          "$audit_tools/gitleaks" git --redact=100 --no-banner --log-opts="--all" .
