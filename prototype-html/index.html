<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>へんてこニュース</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      background: #fff3c4;
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      padding: 24px 18px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      font-size: 34px;
      margin: 20px 0 8px;
    }

    .subtitle {
      font-size: 20px;
      margin-bottom: 24px;
      font-weight: bold;
    }

    .category {
      font-size: 36px;
      margin: 24px 0;
      color: #e85d04;
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    button {
      border: none;
      border-radius: 22px;
      font-size: 24px;
      font-weight: bold;
      padding: 22px 12px;
      background: #ffb703;
      color: #333;
      box-shadow: 0 6px 0 #d99000;
      cursor: pointer;
      touch-action: manipulation;
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #d99000;
    }

    .big-button {
      width: 100%;
      margin-top: 18px;
      background: #8ecae6;
      box-shadow: 0 6px 0 #4f9cbd;
    }

    .picked {
      font-size: 44px;
      font-weight: bold;
      margin-top: 80px;
      animation: pop 0.4s ease-out;
    }

    .result-title {
      font-size: 30px;
      margin-top: 16px;
      color: #d00000;
    }

    .news-lines {
      margin: 24px 0;
      padding: 20px;
      border-radius: 24px;
      background: white;
      font-size: 32px;
      font-weight: bold;
      line-height: 1.6;
    }

    .reaction {
      font-size: 28px;
      font-weight: bold;
      color: #e85d04;
      margin: 18px 0;
    }

    .character {
      font-size: 72px;
      margin: 10px 0;
      animation: bounce 1s infinite;
    }

    .speaking {
      animation: bounce 0.35s infinite;
    }

    @keyframes pop {
      0% {
        transform: scale(0.6);
        opacity: 0;
      }

      70% {
        transform: scale(1.15);
        opacity: 1;
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes bounce {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div id="screen"></div>
  </main>

  <script>
    const categories = [
      {
        title: "だれだ！？",
        key: "who",
        words: ["ゴリラが", "おばけが", "かいじゅうが", "ロボットが", "うちゅうじんが", "あかちゃんが"]
      },
      {
        title: "いつのまに！？",
        key: "when",
        words: ["あさ", "まよなか", "おふろのあと", "ごはんのまえ", "ねてるとき", "おならしたあと"]
      },
      {
        title: "どこで！？",
        key: "where",
        words: ["トイレで", "おふろで", "こうえんで", "うちゅうで", "ふとんのなかで", "れいぞうこのまえで"]
      },
      {
        title: "なにを！？",
        key: "what",
        words: ["プリンを", "バナナを", "パンツを", "くつしたを", "カレーを", "まくらを"]
      },
      {
        title: "なにした！？",
        key: "action",
        words: ["かくした", "たべた", "おどらせた", "ふっとばした", "こちょこちょした", "ころがした"]
      }
    ];

    const reactions = [
      "なんでだよ〜！",
      "なにそれ〜！",
      "へんてこすぎる！",
      "もういっかい！",
      "びっくりした〜！",
      "そんなニュースある！？"
    ];

    let step = 0;
    let selected = [];
    let isSpeaking = false;

    const screen = document.getElementById("screen");

    function renderStart() {
      screen.innerHTML = `
        <h1>へんてこニュース</h1>
        <div class="character">🐥🎤</div>
        <p class="subtitle">へんなニュースをつくるよ！</p>
        <button class="big-button" onclick="startGame()">はじめるドーン！</button>
      `;
    }

    function startGame() {
      step = 0;
      selected = [];
      renderSelect();
    }

    function renderSelect() {
      const category = categories[step];

      screen.innerHTML = `
        <h1>へんてこニュース</h1>
        <div class="category">${category.title}</div>
        <div class="cards">
          ${category.words.map(word => `
            <button onclick="pickWord('${word}')">${word.replace("が", "").replace("を", "").replace("で", "")}</button>
          `).join("")}
        </div>
      `;
    }

    function pickWord(word) {
      selected.push(word);

      screen.innerHTML = `
        <div class="picked">${word}</div>
      `;

      setTimeout(() => {
        step++;
        if (step >= categories.length) {
          renderResult();
        } else {
          renderSelect();
        }
      }, 650);
    }

    function renderResult() {
      const reaction = reactions[Math.floor(Math.random() * reactions.length)];

      screen.innerHTML = `
        <h1 class="result-title">へんてこニュース！</h1>
        <div id="character" class="character">🐥🎤</div>
        <div class="news-lines">
          ${selected.map(word => `<div>${word}</div>`).join("")}
        </div>
        <div class="reaction">${reaction}</div>
        <button class="big-button" onclick="speakNews()">もういっかいきく！</button>
        <button class="big-button" onclick="startGame()">もういっかいつくる！</button>
      `;

      setTimeout(speakNews, 500);
    }

    function speakNews() {
      if (!("speechSynthesis" in window)) {
        return;
      }

      window.speechSynthesis.cancel();

      const politeAction = selected[4].replace("た", "ました");
      const text = `ニュースです！${selected[0]}、${selected[1]}、${selected[2]}、${selected[3]}、${politeAction}！`;

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "ja-JP";
      utterance.rate = 0.9;
      utterance.pitch = 1.25;
      utterance.volume = 1;

      const voices = window.speechSynthesis.getVoices();
      const japaneseVoice = voices.find(voice => voice.lang && voice.lang.startsWith("ja"));
      if (japaneseVoice) {
        utterance.voice = japaneseVoice;
      }

      const character = document.getElementById("character");

      utterance.onstart = () => {
        if (character) character.classList.add("speaking");
      };

      utterance.onend = () => {
        if (character) character.classList.remove("speaking");
      };

      window.speechSynthesis.speak(utterance);
    }

    window.speechSynthesis?.addEventListener?.("voiceschanged", () => { });

    renderStart();
  </script>
</body>

</html>
