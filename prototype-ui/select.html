<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>へんてこニュース</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="viewport">
    <main class="app-shell">
      <header class="app-header" aria-label="へんてこニュース">
        <span class="star">★</span>
        <span class="logo"><span class="c1">へ</span><span class="c2">ん</span><span class="c3">て</span><span class="c4">こ</span><span class="c5">ニ</span><span class="c6">ュ</span><span class="c7">ー</span><span class="c8">ス</span></span>
        <span class="star">★</span>
      </header>

      <section class="screen select-screen">
        <div class="hero hero-select">
          <img class="hero-bg" src="./assets/select-studio.svg" alt="" />
          <img class="alien alien-select" src="./assets/alien-announcer.webp" alt="" />
          <div class="speech speech-select">だれが？</div>
        </div>
        <div class="choice-grid">
          <button class="choice-card yellow" data-result="result.html">ゴリラ</button>
          <button class="choice-card green" data-result="result.html">かいじゅう</button>
          <button class="choice-card purple" data-result="result.html">うちゅうじん</button>
          <button class="choice-card blue-line" data-result="result.html">おばけ</button>
          <button class="choice-card orange-line" data-result="result.html">ロボット</button>
          <button class="choice-card teal" data-result="result.html">きょうりゅう</button>
        </div>
      </section>
      <script>
        document.querySelectorAll('.choice-card').forEach((btn) => {
          btn.addEventListener('click', () => {
            btn.classList.add('picked');
            setTimeout(() => { location.href = btn.dataset.result; }, 220);
          });
        });
      </script>
    </main>
  </div>
</body>
</html>
